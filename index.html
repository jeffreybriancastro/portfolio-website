<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jeffrey Brian Castro — GoHighLevel, CRM &amp; Automation</title>
    <meta
      name="description"
      content="I build GoHighLevel CRM systems, the automations that run them, and the funnels and websites that feed them — on the stack you already have."
    />
    <meta name="author" content="Jeffrey Brian Castro" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#F4F4ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070B14" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://jeffreybrianbuilds.com/" />

    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="apple-touch-icon" href="/img/logo-mark.png" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The GoHighLevel widgets on /contact and /book are served from here. -->
    <link rel="preconnect" href="https://go.jeffreybrianbuilds.com" crossorigin />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link
      rel="preload"
      as="image"
      href="/img/jeffrey-avatar.webp"
      fetchpriority="high"
      media="(min-width: 1100px)"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jeffrey Brian Castro" />
    <meta property="og:title" content="Jeffrey Brian Castro — GoHighLevel, CRM &amp; Automation" />
    <meta
      property="og:description"
      content="GoHighLevel CRM, the automations that run it, and the funnels and websites that feed it. Built by one person."
    />
    <meta property="og:url" content="https://jeffreybrianbuilds.com/" />
    <meta property="og:image" content="https://jeffreybrianbuilds.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
